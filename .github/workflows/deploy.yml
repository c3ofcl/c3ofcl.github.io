name: Aggregate Portfolios and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C3 Repository
        uses: actions/checkout@v4

      - name: Clean Up Member Subdirectories
        run: |
          mkdir -p members
          # remove only subdirectories under members/, preserving static files like members/index.html
          find members -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

      - name: Clone member repositories
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            # trim whitespace and skip empty lines or comments
            line_trimmed=$(echo "$line" | xargs)
            [[ -z "$line_trimmed" || "$line_trimmed" =~ ^# ]] && continue

            # skip external member portfolios (lines containing http:// or https://)
            if echo "$line_trimmed" | grep -qE "https?://"; then
              echo "Skipping clone for external portfolio: $line_trimmed"
              continue
            fi

            username=$(echo "$line_trimmed" | cut -d'/' -f1)
            username_lower=$(echo "$username" | tr '[:upper:]' '[:lower:]')

            echo "Cloning $line_trimmed into members/${username_lower}..."
            target_dir="members/${username_lower}"
            rm -rf "$target_dir"

            if git clone --depth 1 "https://github.com/${line_trimmed}.git" "$target_dir"; then
              rm -rf "${target_dir}/.git"
              echo "Successfully cloned $line_trimmed into $target_dir."
            else
              echo "::warning::Failed to clone $line_trimmed, skipping."
              rm -rf "$target_dir"
            fi
          done < members.txt

      - name: Generate Members List
        run: node scripts/generate-members.cjs

      - name: Prepare Deployment Artifacts
        run: |
          # remove .gitignore so that generated files (e.g. members/members.json) are deployed to gh-pages
          rm -f .gitignore
          touch .nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
