name: Aggregate Portfolios and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C3 Repository
        uses: actions/checkout@v4

      - name: Clean Up Member Subdirectories
        run: |
          mkdir -p members
          # remove only subdirectories under members/, preserving static files like members/index.html
          find members -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

      - name: Clone member repositories
        run: |
          node scripts/generate-members.cjs --list-repos | while read -r id repo; do
            [ -z "$id" ] || [ -z "$repo" ] && continue
            echo "Cloning $repo into members/${id}..."
            target_dir="members/${id}"
            rm -rf "$target_dir"

            if git clone --depth 1 "https://github.com/${repo}.git" "$target_dir"; then
              rm -rf "${target_dir}/.git"
              echo "Successfully cloned $repo into $target_dir."
            else
              echo "::warning::Failed to clone $repo, skipping."
              rm -rf "$target_dir"
            fi
          done

      - name: Generate Members List
        run: node scripts/generate-members.cjs

      - name: Prepare Deployment Artifacts
        run: |
          # remove .gitignore so that generated files (e.g. members/members.json) are deployed to gh-pages
          rm -f .gitignore
          touch .nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
