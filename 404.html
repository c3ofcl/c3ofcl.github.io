<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりませんでした - C3 | Creative Computing Club</title>
  <script>
    (function () {
      var path = window.location.pathname;
      // capture the username (member name) immediately after "members/"
      var regex = /^((?:.*\/)?members\/)([^\/]+)(\/.*)?$/i;
      var match = path.match(regex);
      if (match) {
        var prefix = match[1];
        var member = match[2];
        var rest = match[3] || "";

        // redirect to lowercase URL if the member name contains uppercase letters
        if (/[A-Z]/.test(member)) {
          var lowerMember = member.toLowerCase();
          if (!rest && !lowerMember.includes('.')) {
            rest = "/";
          }
          var newPath = prefix + lowerMember + rest;
          var targetUrl = window.location.origin + newPath + window.location.search + window.location.hash;
          window.location.replace(targetUrl);
          return;
        }
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/404.css">
</head>

<body>
  <main class="error-page">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>指定されたページが見つかりませんでした。<br>URLをご確認いただくか、トップページよりお探しください。</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">トップページへ</a>
    </div>
  </main>
</body>

</html>
